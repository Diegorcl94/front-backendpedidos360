spring.application.name=pedidos360-notificaciones

# Puerto del nuevo microservicio
server.port=8081

# Conexion con RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Confirmaciones manuales de RabbitMQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Evitar reencolar indefinidamente mensajes fallidos
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Reintentos locales y limitados
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=1.0
spring.rabbitmq.listener.simple.retry.max-interval=2000
