# Perfil opt-in. No se activa desde este archivo ni cambia el perfil local H2.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2,TLSv1.3&connectTimeout=10000&socketTimeout=30000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# Truststore dedicado con la CA del proyecto Aiven; no modifica TLS de JWT/Entra ID.
# URL de archivo, por ejemplo file:/C:/ruta/privada/aiven-mysql-truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${MYSQL_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${MYSQL_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false

# Solo demostración académica. En producción: migraciones Flyway/Liquibase y validate.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
