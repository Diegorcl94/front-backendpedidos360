spring.application.name=pedidos360-bff
server.port=${PORT:8080}

# Microsoft Entra ID. Valores de Pedidos360; las variables de entorno tienen prioridad.
azure.tenant-id=${AZURE_TENANT_ID:bb5324af-c266-41ed-b36c-a971641c7af2}
azure.api-client-id=${AZURE_API_CLIENT_ID:07f91b77-8d9f-46a3-964f-5220af9bb815}

# CORS del frontend Angular.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# Base de datos local simple para la demo.
spring.datasource.url=jdbc:h2:mem:pedidos360;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================
# RABBITMQ - PEDIDOS360
# =====================================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Confirmaciones de publicacion RabbitMQ
spring.rabbitmq.publisher-confirm-type=correlated

# Detectar mensajes no enrutados a ninguna cola
spring.rabbitmq.publisher-returns=true

# Obligar a devolver mensajes sin destino
spring.rabbitmq.template.mandatory=true

# KAFKA - EV3
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
