spring.application.name=pedidos360-rabbit-admin

# API de laboratorio: solo interfaz loopback, sin confiar en cabeceras de proxy.
server.address=127.0.0.1
server.port=8082
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=3s

# Obligatoria, sin valor predeterminado. No guardar una clave real en el repositorio.
admin.security.api-key=${RABBIT_ADMIN_API_KEY:}
# Solo consultas GET de metadatos. Las mutaciones se realizan mediante AMQP.
admin.rabbit-management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
